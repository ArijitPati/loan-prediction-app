<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CENTRAL BANK OF ARIJIT PATI – Loan Eligibility</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #eef3f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 420px;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 3px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            background: #0d47a1;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #08306b;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
            font-size: 15px;
        }

        .approved {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

    </style>
</head>

<body>
<div class="container">
    <h2>CENTRAL BANK OF ARIJIT PATI</h2>
    <div class="subtitle">Loan Eligibility Prediction</div>

    <form action="/predict" method="POST">

        <!-- Gender -->
        <label>Gender</label>
        <select name="gender">
            <option value="1" {{ 'selected' if form_data.get('gender')=='1' else '' }}>Male</option>
            <option value="0" {{ 'selected' if form_data.get('gender')=='0' else '' }}>Female</option>
        </select>

        <!-- Married -->
        <label>Married</label>
        <select name="married">
            <option value="1" {{ 'selected' if form_data.get('married')=='1' else '' }}>Yes</option>
            <option value="0" {{ 'selected' if form_data.get('married')=='0' else '' }}>No</option>
        </select>

        <!-- Dependents -->
        <label>Dependents</label>
        <input type="number" name="dependents" value="{{ form_data.get('dependents','') }}" min="0">

        <!-- Education -->
        <label>Education</label>
        <select name="education">
            <option value="1" {{ 'selected' if form_data.get('education')=='1' else '' }}>Graduate</option>
            <option value="0" {{ 'selected' if form_data.get('education')=='0' else '' }}>Not Graduate</option>
        </select>

        <!-- Self Employed -->
        <label>Self Employed</label>
        <select name="self_employed">
            <option value="1" {{ 'selected' if form_data.get('self_employed')=='1' else '' }}>Yes</option>
            <option value="0" {{ 'selected' if form_data.get('self_employed')=='0' else '' }}>No</option>
        </select>

        <!-- Applicant Income -->
        <label>Applicant Income</label>
        <input type="number" name="applicant_income" value="{{ form_data.get('applicant_income','') }}" step="0.01">

        <!-- Coapplicant Income -->
        <label>Coapplicant Income</label>
        <input type="number" name="coapplicant_income" value="{{ form_data.get('coapplicant_income','') }}" step="0.01">

        <!-- Loan Amount -->
        <label>Loan Amount</label>
        <input type="number" name="loan_amount" value="{{ form_data.get('loan_amount','') }}" step="0.01">

        <!-- Loan Term -->
        <label>Loan Amount Term (Months)</label>
        <input type="number" name="loan_amount_term" value="{{ form_data.get('loan_amount_term','') }}">

        <!-- Credit History -->
        <label>Credit History (0 or 1)</label>
        <select name="credit_history">
            <option value="1" {{ 'selected' if form_data.get('credit_history')=='1' else '' }}>Good</option>
            <option value="0" {{ 'selected' if form_data.get('credit_history')=='0' else '' }}>Bad</option>
        </select>

        <!-- Property Area -->
        <label>Property Area</label>
        <select name="property_area">
            <option value="0" {{ 'selected' if form_data.get('property_area')=='0' else '' }}>Urban</option>
            <option value="1" {{ 'selected' if form_data.get('property_area')=='1' else '' }}>Semiurban</option>
            <option value="2" {{ 'selected' if form_data.get('property_area')=='2' else '' }}>Rural</option>
        </select>

        <button type="submit">Check Loan Eligibility</button>
    </form>

    {% if prediction %}
    <div class="result-box {{ 'approved' if 'Approved' in prediction else 'rejected' }}">
        {{ prediction }}
    </div>
    {% endif %}

</div>
</body>
</html>
